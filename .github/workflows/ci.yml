name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm run lint
      - working-directory: client
        run: npm test
      - working-directory: client
        run: npm run typecheck
      - working-directory: client
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        run: npm run build

      - working-directory: client
        run: npx playwright install --with-deps chromium
      - working-directory: client
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storefront-test-results
          path: client/test-results/

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      # Medusa test-utils creates and drops an isolated database for HTTP
      # integration tests. It reads DB_* credentials directly at module load,
      # so DATABASE_URL alone is not sufficient for the test database admin
      # connection. Keep these aligned with the Postgres service above.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/minara_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_WAITINGROOM_DATABASE: postgres
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      JWT_SECRET: ci-jwt-secret-not-for-production
      COOKIE_SECRET: ci-cookie-secret-not-for-production
      MEDUSA_BACKEND_URL: http://localhost:9000
      STOREFRONT_URL: http://localhost:3000
      CHECKOUT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Install the reviewed lockfile; do not silently change dependencies in CI.
      - working-directory: server
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - working-directory: server
        run: npm run lint
      - working-directory: server
        run: npm run typecheck
      - working-directory: server
        run: npm run build
      - working-directory: server
        run: npm run test:unit
      - working-directory: server
        run: npm run test:integration:http
